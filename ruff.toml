# EmbyCon FR v1.14 : filet de lint realiste pour la fourche.
#
# Historique (2026-10-09) : la config precedente laissait extend-ignore
# entierement commentee (donc rien n'etait ignore) et produisait 745 erreurs,
# dont ~500 faux positifs structurels : PLE1205 x366 (le logger maison
# SimpleLogging utilise le format {0} + arguments PAR CONCEPTION ; ruff le
# confond avec le module logging standard qui attend du %s) et UP031 x134
# (printf-style herite du code d'origine). La CI release (ruff check) echouait
# donc sur tout push GitHub.
#
# Choix v1.14 : un filet de fond vert qui attrape les vrais bugs, puis un
# renforcement progressif famille par famille APRES la release (roadmap en
# bas de fichier). Toute famille re-ajoutee doit etre corrigee dans le meme
# commit, sinon la CI devient un mur.

include = [
  "plugin.video.embycon/resources/**/*.py",
  "plugin.video.embycon/*.py"
]

exclude = [
  "plugin.video.embycon/resources/lib/websocket/"
]

target-version = "py38"

[lint]
select = [
  "E4",   # pycodestyle : indentation/whitespace bloquants
  "E7",   # pycodestyle : comparaisons, assignations ambigues
  "E9",   # pycodestyle : erreurs de syntaxe
  "F",    # pyflakes : noms non definis, imports inutilises, redefinitions
  "W",    # pycodestyle : warnings (whitespace, lignes mortes)
  "T10",  # jamais de debug/patch (breakpoint)
  "T20",  # jamais de print : passer par SimpleLogging
]

# -------------------------------------------------------------------------
# Renforcement post-release, une famille par commit, du moins au plus couteux :
#   1. "I"        : tri des imports (38 sites I001, auto-fix via --fix)
#   2. "RET","RSE","PIE" : simplifications retour/raise (auto-fix en partie)
#   3. "SIM"      : if redondants (11 SIM114 + 3 SIM102)
#   4. "S110"     : try-except-pass a documenter (7 sites)
#   5. "ANN"      : annotations de types, dette massive, a planifier
#
# Ignores PERMANENTS (a ne pas re-ajouter sans re-design) :
#   - PLE1205 / LOG / G : faux positif structurel sur SimpleLogging ({0}+args)
#   - UP031 / UP030 / UP032 : printf-style herite du code d'origine
#   - BLE001 : except Exception = idiomatique Kodi (erreurs xbmc heterogenes)
#   - ERA001 : le code commente d'origine documente des branches desactivees
# -------------------------------------------------------------------------
